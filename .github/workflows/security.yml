name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Re-scan weekly so newly published rules are caught on unchanged code.
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
      # Uploading SARIF to the Security tab requires GitHub Advanced Security,
      # which is not available on a private repository. The scan result is the
      # gate; publishing it is a convenience, so a failure here must not fail
      # the job. This starts working on its own once the repository is public.
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov.sarif
          category: checkov

  trivy:
    name: trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Without this the action builds the SARIF report across every
          # severity and ignores `severity` above, so exit-code 1 then fails
          # the job on any LOW finding. That is what the first run did.
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is still
          # a leaked secret.
          fetch-depth: 0

      # Run the binary rather than gitleaks-action. The action calls the GitHub
      # API to post findings on the pull request, which needs pull-requests
      # write and fails with "Resource not accessible by integration" without
      # it. It also scans only the commits in the pull request, where this scans
      # every commit. Running the released binary means CI and `make security`
      # execute the same command against the same version.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks version
          ./gitleaks detect --no-banner --redact --exit-code 1
